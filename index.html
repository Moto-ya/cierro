<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13402F">
<title>Cierro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}/* Cierro · identidad "Círculo cerrado": la pantalla es una herramienta de campo,
   un solo foco por pantalla, botones grandes para usar de pie y con el sol encima. */
:root {
  --bosque: #13402F;      /* marca, texto principal */
  --meta: #2FBF71;        /* avance y confirmación */
  --crema: #F5F7F2;       /* fondo */
  --oliva: #56615A;       /* texto secundario */
  --superficie: #FFFFFF;
  --borde: #DDE5DA;
  --suave: #D7F2E2;
  --sobre-marca: #FFFFFF;
  --sobre-marca-2: #CFE3D7;
  --critico: #B42318;
  --critico-suave: #FDE8E4;
  --alerta: #A15C07;
  --alerta-suave: #FDF0D9;
  --f-titulo: "Manrope", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, sans-serif;
  --radio: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bosque: #E4F1E8; --meta: #3DD083; --crema: #0D1D17; --oliva: #A3B3A9;
    --superficie: #152A22; --borde: #24443A; --suave: #1E3D31; --sobre-marca: #0D1D17; --sobre-marca-2: #1E3D31;
    --critico: #FF8A7A; --critico-suave: #3A1A16; --alerta: #F3B860; --alerta-suave: #3A2A12; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .marca { background: var(--meta); }
}
:root[data-theme="dark"] {
  --bosque: #E4F1E8; --meta: #3DD083; --crema: #0D1D17; --oliva: #A3B3A9;
  --superficie: #152A22; --borde: #24443A; --suave: #1E3D31; --sobre-marca: #0D1D17; --sobre-marca-2: #1E3D31;
  --critico: #FF8A7A; --critico-suave: #3A1A16; --alerta: #F3B860; --alerta-suave: #3A2A12; color-scheme: dark;
}
:root[data-theme="dark"] .marca { background: var(--meta); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--crema); color: var(--bosque); font: 15px/1.45 var(--f-texto); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; gap: 14px; }
h1, h2, h3 { font-family: var(--f-titulo); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 19px; font-weight: 800; }
p { margin: 0; }
.sec { color: var(--oliva); }
.peq { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.etiqueta { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva); }
.fila { display: flex; align-items: center; gap: 10px; }
.fila > .crece { flex: 1; min-width: 0; }
.entre { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pila { display: flex; flex-direction: column; gap: 10px; }
.rejilla2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rejilla3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.barra { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.volver { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 0; background: none; border: 0; font-weight: 700; font-size: 15px; color: var(--bosque); cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--suave); color: var(--bosque); white-space: nowrap; }
.chip.marca { background: var(--bosque); color: var(--sobre-marca); }
.chip.critico { background: var(--critico-suave); color: var(--critico); }
.chip.alerta { background: var(--alerta-suave); color: var(--alerta); }

.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; }
.tarjeta.destacada { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.tarjeta.destacada .sec, .tarjeta.destacada .etiqueta { color: var(--sobre-marca-2); }
.lista { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
.lista > * + * { border-top: 1px solid var(--borde); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.item:hover { background: var(--suave); }
.vacio { padding: 18px 14px; color: var(--oliva); text-align: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--borde); background: var(--superficie); font-weight: 700; cursor: pointer; color: var(--bosque); text-decoration: none; }
.btn.primario { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); font-family: var(--f-titulo); font-size: 17px; min-height: 56px; }
.btn.grande { flex-direction: column; min-height: 76px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.peligro { color: var(--critico); }
:focus-visible { outline: 3px solid var(--meta); outline-offset: 2px; }

.medidor { height: 8px; border-radius: 4px; background: var(--suave); overflow: hidden; }
.tarjeta.destacada .medidor { background: color-mix(in srgb, var(--sobre-marca) 20%, transparent); }
.medidor > span { display: block; height: 100%; background: var(--meta); border-radius: 4px; }
.medidor.alerta > span { background: var(--alerta); }
.medidor.critico > span { background: var(--critico); }

.aviso { display: flex; gap: 10px; padding: 10px 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; }
.aviso .tira { width: 6px; flex-shrink: 0; border-radius: 3px; background: var(--meta); }
.aviso.critico .tira { background: var(--critico); }
.aviso.alto .tira { background: var(--alerta); }
.aviso b { display: block; font-size: 15px; }

label.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--oliva); }
.campo input, .campo select, .campo textarea, .buscar { min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); color: var(--bosque); font-size: 16px; width: 100%; }
.campo textarea { min-height: 80px; resize: vertical; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opcion { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--superficie); font-weight: 600; cursor: pointer; color: var(--bosque); }
.opcion[aria-pressed="true"] { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.radio { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; cursor: pointer; }
.radio input { width: 20px; height: 20px; accent-color: var(--meta); }

.mosaico { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.modulo { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 12px; min-height: 104px; border-radius: 16px; background: var(--superficie); border: 1px solid var(--borde); cursor: pointer; text-align: left; color: var(--bosque); }
.modulo b { font-family: var(--f-titulo); font-size: 15px; line-height: 1.2; }
.modulo small { color: var(--oliva); font-size: 12px; line-height: 1.3; }
.modulo.pronto { opacity: .6; }
.hoy-btn { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--bosque); color: var(--sobre-marca); border: 0; cursor: pointer; text-align: left; width: 100%; }
.hoy-btn b { font-family: var(--f-titulo); font-size: 20px; display: block; }
.hoy-btn small { color: var(--sobre-marca-2); font-size: 14px; }
.ico { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.presentacion { min-height: calc(100vh - 48px); display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.presentacion .logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-titulo); font-size: 30px; font-weight: 800; }
.presentacion .tip { background: var(--superficie); border: 1px solid var(--borde); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.presentacion .tip h2 { font-size: 24px; }
.presentacion .tip p { font-size: 16px; line-height: 1.55; }
.lema { color: var(--oliva); font-weight: 600; }

.banda { padding: 8px 12px; border-radius: 12px; background: var(--alerta-suave); color: var(--alerta); font-size: 13px; font-weight: 600; }
.mensaje { padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }
.mensaje.error { background: var(--critico-suave); color: var(--critico); }
.mensaje.ok { background: var(--suave); color: var(--bosque); }
.tabla { overflow-x: auto; border: 1px solid var(--borde); border-radius: 12px; }
.tabla table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tabla td, .tabla th { padding: 6px 8px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
.tabla th { color: var(--oliva); font-weight: 600; }
.pie { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--crema); display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.apilada { height: 12px; border-radius: 6px; background: var(--suave); overflow: hidden; }
.apilada > span { display: block; height: 100%; background: var(--meta); }
.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--suave); display: inline-block; }
.punto.lleno { background: var(--meta); }
.foto-recibo { width: 100%; max-height: 360px; object-fit: contain; border-radius: 14px; border: 1px solid var(--borde); background: var(--superficie); }

.semaforo { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--superficie); border: 1px solid var(--borde); }
.semaforo b { font-family: var(--f-titulo); font-size: 22px; }
.semaforo .luz { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; background: var(--borde); }
.semaforo.verde .luz { background: var(--meta); } .semaforo.amarillo .luz { background: var(--alerta); } .semaforo.rojo .luz { background: var(--critico); }
.semaforo.rojo { background: var(--critico-suave); border-color: transparent; }
.semaforo.amarillo { background: var(--alerta-suave); border-color: transparent; }
.eleccion[aria-pressed="true"] { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.paso { display: flex; align-items: center; gap: 10px; }
.paso .btn { width: 48px; padding: 0; font-size: 22px; }
.paso b { min-width: 28px; text-align: center; font-size: 17px; }

.banda { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.banda.admin { background: var(--bosque); color: var(--sobre-marca); }
.banda.admin .volver { color: var(--sobre-marca); min-height: 32px; }
.banda .volver { min-height: 32px; color: inherit; text-decoration: underline; }
input[type="password"] { letter-spacing: .1em; }
</style>
