<!doctype html>
<html lang="es" data-theme="light"><head><meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13402F">
<title>Cierro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}/* Cierro · identidad "Círculo cerrado": la pantalla es una herramienta de campo,
   un solo foco por pantalla, botones grandes para usar de pie y con el sol encima. */
:root {
  --bosque: #13402F;      /* marca, texto principal */
  --meta: #2FBF71;        /* avance y confirmación */
  --crema: #F5F7F2;       /* fondo */
  --oliva: #56615A;       /* texto secundario */
  --superficie: #FFFFFF;
  --borde: #DDE5DA;
  --suave: #D7F2E2;
  --sobre-marca: #FFFFFF;
  --sobre-marca-2: #CFE3D7;
  --critico: #B42318;
  --critico-suave: #FDE8E4;
  --alerta: #A15C07;
  --alerta-suave: #FDF0D9;
  --f-titulo: "Manrope", system-ui, sans-serif;
  --f-texto: "Inter", system-ui, sans-serif;
  --radio: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bosque: #E4F1E8; --meta: #3DD083; --crema: #0D1D17; --oliva: #A3B3A9;
    --superficie: #152A22; --borde: #24443A; --suave: #1E3D31; --sobre-marca: #0D1D17; --sobre-marca-2: #1E3D31;
    --critico: #FF8A7A; --critico-suave: #3A1A16; --alerta: #F3B860; --alerta-suave: #3A2A12; color-scheme: dark;
  }
  :root:not([data-theme="light"]) .marca { background: var(--meta); }
}
:root[data-theme="dark"] {
  --bosque: #E4F1E8; --meta: #3DD083; --crema: #0D1D17; --oliva: #A3B3A9;
  --superficie: #152A22; --borde: #24443A; --suave: #1E3D31; --sobre-marca: #0D1D17; --sobre-marca-2: #1E3D31;
  --critico: #FF8A7A; --critico-suave: #3A1A16; --alerta: #F3B860; --alerta-suave: #3A2A12; color-scheme: dark;
}
:root[data-theme="dark"] .marca { background: var(--meta); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--crema); color: var(--bosque); font: 15px/1.45 var(--f-texto); -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
#app { max-width: 520px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; gap: 14px; }
h1, h2, h3 { font-family: var(--f-titulo); margin: 0; text-wrap: balance; line-height: 1.2; }
h1 { font-size: 26px; font-weight: 800; }
h2 { font-size: 19px; font-weight: 800; }
p { margin: 0; }
.sec { color: var(--oliva); }
.peq { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.etiqueta { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--oliva); }
.fila { display: flex; align-items: center; gap: 10px; }
.fila > .crece { flex: 1; min-width: 0; }
.entre { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.pila { display: flex; flex-direction: column; gap: 10px; }
.rejilla2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.rejilla3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }

.barra { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.volver { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 6px 0 0; background: none; border: 0; font-weight: 700; font-size: 15px; color: var(--bosque); cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--suave); color: var(--bosque); white-space: nowrap; }
.chip.marca { background: var(--bosque); color: var(--sobre-marca); }
.chip.critico { background: var(--critico-suave); color: var(--critico); }
.chip.alerta { background: var(--alerta-suave); color: var(--alerta); }

.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); padding: 12px 14px; }
.tarjeta.destacada { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.tarjeta.destacada .sec, .tarjeta.destacada .etiqueta { color: var(--sobre-marca-2); }
.lista { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--radio); overflow: hidden; }
.lista > * + * { border-top: 1px solid var(--borde); }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 52px; width: 100%; background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
.item:hover { background: var(--suave); }
.vacio { padding: 18px 14px; color: var(--oliva); text-align: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; border: 1px solid var(--borde); background: var(--superficie); font-weight: 700; cursor: pointer; color: var(--bosque); text-decoration: none; }
.btn.primario { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); font-family: var(--f-titulo); font-size: 17px; min-height: 56px; }
.btn.grande { flex-direction: column; min-height: 76px; font-size: 14px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.peligro { color: var(--critico); }
:focus-visible { outline: 3px solid var(--meta); outline-offset: 2px; }

.medidor { height: 8px; border-radius: 4px; background: var(--suave); overflow: hidden; }
.tarjeta.destacada .medidor { background: color-mix(in srgb, var(--sobre-marca) 20%, transparent); }
.medidor > span { display: block; height: 100%; background: var(--meta); border-radius: 4px; }
.medidor.alerta > span { background: var(--alerta); }
.medidor.critico > span { background: var(--critico); }

.aviso { display: flex; gap: 10px; padding: 10px 12px; background: var(--superficie); border: 1px solid var(--borde); border-radius: 14px; }
.aviso .tira { width: 6px; flex-shrink: 0; border-radius: 3px; background: var(--meta); }
.aviso.critico .tira { background: var(--critico); }
.aviso.alto .tira { background: var(--alerta); }
.aviso b { display: block; font-size: 15px; }

label.campo { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--oliva); }
.campo input, .campo select, .campo textarea, .buscar { min-height: 48px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--borde); background: var(--superficie); color: var(--bosque); font-size: 16px; width: 100%; }
.campo textarea { min-height: 80px; resize: vertical; }
.opciones { display: flex; flex-wrap: wrap; gap: 8px; }
.opcion { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--borde); background: var(--superficie); font-weight: 600; cursor: pointer; color: var(--bosque); }
.opcion[aria-pressed="true"] { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.radio { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; cursor: pointer; }
.radio input { width: 20px; height: 20px; accent-color: var(--meta); }

.mosaico { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.modulo { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 14px 12px; min-height: 104px; border-radius: 16px; background: var(--superficie); border: 1px solid var(--borde); cursor: pointer; text-align: left; color: var(--bosque); }
.modulo b { font-family: var(--f-titulo); font-size: 15px; line-height: 1.2; }
.modulo small { color: var(--oliva); font-size: 12px; line-height: 1.3; }
.modulo.pronto { opacity: .6; }
.hoy-btn { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px; background: var(--bosque); color: var(--sobre-marca); border: 0; cursor: pointer; text-align: left; width: 100%; }
.hoy-btn b { font-family: var(--f-titulo); font-size: 20px; display: block; }
.hoy-btn small { color: var(--sobre-marca-2); font-size: 14px; }
.ico { width: 24px; height: 24px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.presentacion { min-height: calc(100vh - 48px); display: flex; flex-direction: column; gap: 18px; justify-content: center; }
.presentacion .logo { display: flex; align-items: center; gap: 10px; font-family: var(--f-titulo); font-size: 30px; font-weight: 800; }
.presentacion .tip { background: var(--superficie); border: 1px solid var(--borde); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
.presentacion .tip h2 { font-size: 24px; }
.presentacion .tip p { font-size: 16px; line-height: 1.55; }
.lema { color: var(--oliva); font-weight: 600; }

.banda { padding: 8px 12px; border-radius: 12px; background: var(--alerta-suave); color: var(--alerta); font-size: 13px; font-weight: 600; }
.mensaje { padding: 10px 12px; border-radius: 12px; font-size: 14px; font-weight: 600; }
.mensaje.error { background: var(--critico-suave); color: var(--critico); }
.mensaje.ok { background: var(--suave); color: var(--bosque); }
.tabla { overflow-x: auto; border: 1px solid var(--borde); border-radius: 12px; }
.tabla table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
.tabla td, .tabla th { padding: 6px 8px; border-bottom: 1px solid var(--borde); text-align: left; white-space: nowrap; }
.tabla th { color: var(--oliva); font-weight: 600; }
.pie { position: sticky; bottom: 0; padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--crema); display: flex; flex-direction: column; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.apilada { height: 12px; border-radius: 6px; background: var(--suave); overflow: hidden; }
.apilada > span { display: block; height: 100%; background: var(--meta); }
.punto { width: 10px; height: 10px; border-radius: 50%; background: var(--suave); display: inline-block; }
.punto.lleno { background: var(--meta); }
.foto-recibo { width: 100%; max-height: 360px; object-fit: contain; border-radius: 14px; border: 1px solid var(--borde); background: var(--superficie); }

.semaforo { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: 18px; background: var(--superficie); border: 1px solid var(--borde); }
.semaforo b { font-family: var(--f-titulo); font-size: 22px; }
.semaforo .luz { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; background: var(--borde); }
.semaforo.verde .luz { background: var(--meta); } .semaforo.amarillo .luz { background: var(--alerta); } .semaforo.rojo .luz { background: var(--critico); }
.semaforo.rojo { background: var(--critico-suave); border-color: transparent; }
.semaforo.amarillo { background: var(--alerta-suave); border-color: transparent; }
.eleccion[aria-pressed="true"] { background: var(--bosque); color: var(--sobre-marca); border-color: var(--bosque); }
.paso { display: flex; align-items: center; gap: 10px; }
.paso .btn { width: 48px; padding: 0; font-size: 22px; }
.paso b { min-width: 28px; text-align: center; font-size: 17px; }

.banda { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.banda.admin { background: var(--bosque); color: var(--sobre-marca); }
.banda.admin .volver { color: var(--sobre-marca); min-height: 32px; }
.banda .volver { min-height: 32px; color: inherit; text-decoration: underline; }
input[type="password"] { letter-spacing: .1em; }

/* ===== 0.7 · Ambientación (olas verdes) y ficha Crear clave ===== */
:root { --bosque-ola: #0E5A3A; }
:root[data-theme="dark"] { --bosque-ola: #1E6B47; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bosque-ola: #1E6B47; } }
#app:has(.olas) { position: relative; }
.olas { position: absolute; top: 0; bottom: 0; left: calc(50% - 50vw); width: 100vw; pointer-events: none; z-index: -1; overflow: hidden; }
body:has(.olas) { overflow-x: clip; }
.olas svg { position: absolute; left: 0; width: 100%; display: block; }
.olas .ola-arriba { top: 0; height: clamp(80px, 13vh, 130px); }
.olas .ola-abajo { bottom: 0; height: clamp(60px, 9vh, 100px); }
.ambiente { gap: 16px; padding-block: clamp(30px, 6vh, 64px) clamp(58px, 9vh, 96px); justify-content: space-between; }
.ambiente .logo { font-size: 34px; gap: 12px; }
.ambiente .logo svg { width: 44px; height: 44px; }
.subrayado::after { content: ""; display: block; width: 46%; max-width: 180px; height: 4px; margin-top: 10px; border-radius: 4px;
  background: linear-gradient(90deg, var(--meta) 0%, color-mix(in srgb, var(--meta) 55%, transparent) 100%); transform: rotate(-1.5deg); }
.encabezado-clave { display: flex; align-items: center; gap: 14px; }
.encabezado-clave .escudo { width: 104px; flex-shrink: 0; }
.encabezado-clave h1 { font-size: clamp(26px, 7.4vw, 32px); line-height: 1.12; }
.encabezado-clave h1::after { margin-left: 30%; }
.encabezado-clave p { font-size: 15px; line-height: 1.4; }
.nota-importante { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--suave); }
.nota-importante .sello { display: grid; place-items: center; width: 52px; height: 52px; flex-shrink: 0; border-radius: 50%; color: var(--meta);
  background: color-mix(in srgb, var(--superficie) 55%, transparent); }
.nota-importante .sello .ico { width: 32px; height: 32px; }
.nota-importante > div { display: flex; flex-direction: column; gap: 2px; padding-left: 14px; border-left: 1px solid color-mix(in srgb, var(--meta) 35%, transparent); }
.nota-importante b { font-family: var(--f-titulo); font-size: 18px; }
.nota-importante span { font-size: 14px; line-height: 1.4; }
.campo-clave { display: flex; flex-direction: column; gap: 6px; }
.requisitos + .campo-clave { margin-top: 8px; }
.campo-clave label { font-family: var(--f-titulo); font-weight: 800; font-size: 17px; color: var(--bosque); }
.campo-clave .caja { display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 0 6px 0 16px; border-radius: 16px;
  border: 1.5px solid var(--borde); background: var(--superficie); }
.campo-clave .caja:focus-within { border-color: var(--meta); }
.campo-clave .caja > .ico { color: var(--oliva); }
.campo-clave input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 17px; color: var(--bosque); padding: 12px 0; }
.campo-clave input::placeholder { color: var(--oliva); letter-spacing: normal; opacity: .85; }
.ojo { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 12px; background: none; color: var(--bosque); cursor: pointer; }
.ojo .tachon { display: none; }
.ojo[aria-pressed="true"] .tachon { display: inline; }
.requisitos { display: flex; justify-content: space-between; gap: 6px; padding: 0 4px; font-size: clamp(12px, 3.6vw, 14px); color: var(--oliva); }
.requisitos span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.requisitos .ico { width: 20px; height: 20px; stroke-width: 1.6; }
.requisitos .ok { color: var(--bosque); font-weight: 600; }
.requisitos .ok .ico circle { fill: var(--meta); stroke: var(--meta); }
.requisitos .ok .ico path { stroke: #fff; stroke-width: 2.4; }
.ambiente .btn.primario { min-height: 58px; font-size: 20px; border-radius: 18px; margin-top: 8px; }
.lema-pie { text-align: center; font-family: var(--f-titulo); font-style: italic; font-weight: 800; font-size: 19px; color: var(--bosque); }
.lema-pie::after { margin: 8px auto 0; width: 40%; }
/* ===== 0.7 · Ficha Consejo del día ===== */
.consejo { gap: 20px; }
.marca-lema { display: flex; flex-direction: column; gap: 6px; }
.marca-lema .lema { font-family: var(--f-titulo); font-weight: 700; font-size: 18px; color: var(--oliva); }
.marca-lema .lema::after { width: 42%; margin-left: 30%; }
.consejo .tip { background: var(--superficie); border: 1px solid var(--borde); border-radius: 24px; padding: 20px; gap: 16px;
  box-shadow: 0 10px 30px -18px rgba(19, 64, 47, .35); }
.etiqueta-dia { align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 999px;
  background: var(--suave); color: var(--bosque); font-family: var(--f-titulo); font-weight: 800; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.etiqueta-dia .ico { color: var(--meta); width: 22px; height: 22px; }
.tip-cabeza { display: flex; align-items: center; gap: 14px; }
.tip-cabeza .ilustracion { width: 112px; flex-shrink: 0; }
.tip-cabeza h2 { font-size: clamp(24px, 7vw, 30px) !important; line-height: 1.1; padding-left: 14px; border-left: 1px solid var(--borde); }
.tip-cabeza h2::after { width: 70%; margin-left: 20%; }
.consejo .tip > p { font-size: 17px !important; line-height: 1.5 !important; color: var(--bosque); }
.frase { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--suave); }
.frase .ico { width: 40px; height: 40px; color: var(--meta); stroke-width: 1.8; padding-right: 12px; box-sizing: content-box; border-right: 1px solid color-mix(in srgb, var(--meta) 35%, transparent); }
.frase b { font-family: var(--f-titulo); font-size: 18px; line-height: 1.3; }
.lectura { align-items: stretch; text-align: center; gap: 12px; }
.lectura p { font-size: 15px; }
.barra-lectura { height: 12px; border-radius: 6px; background: var(--borde); overflow: hidden; }
.barra-lectura span { display: block; height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--meta), #3DD083); transition: width linear; }
.consejo #comencemos { gap: 12px; }
.consejo #comencemos .ico { width: 30px; height: 30px; }
.consejo #comencemos[disabled] { opacity: 1; background: color-mix(in srgb, var(--bosque) 45%, var(--crema)); border-color: transparent; }
.consejo #comencemos .seg { font-family: var(--f-texto); font-weight: 500; }
.consejo #comencemos .seg::before { content: "· "; }
/* ===== 0.7 · Ficha Pantalla de inicio ===== */
.entrar { gap: 18px; }
.bienvenida { display: flex; align-items: center; gap: 12px; padding: 18px 14px; border-radius: 24px; background: var(--suave); }
.bienvenida .ilustracion { width: 88px; flex-shrink: 0; }
.bienvenida > .pila { padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--meta) 35%, transparent); gap: 8px; }
.bienvenida h1 { font-size: clamp(20px, 5.9vw, 25px); line-height: 1.15; text-wrap: wrap; }
.bienvenida h1::after { width: 55%; margin-left: 35%; margin-top: 6px; }
.bienvenida p { font-size: 15px; line-height: 1.4; }
.centro { text-align: center; }
.entrar > .sec.centro { font-size: 15px; }
.entrar .btn.primario .ico { width: 26px; height: 26px; }
.entrar .btn.primario { margin-top: 4px; box-shadow: 0 10px 20px -14px rgba(19, 64, 47, .7); }
.enlace-verde { align-self: center; background: none; border: 0; padding: 6px 4px 10px; min-height: 44px; cursor: pointer;
  font-family: var(--f-titulo); font-weight: 800; font-size: 17px; color: var(--bosque);
  text-decoration: underline; text-decoration-color: var(--meta); text-decoration-thickness: 3px; text-underline-offset: 8px; }
/* ===== 0.7 · Ficha Menú principal ===== */
.menu-cabeza { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-top: clamp(14px, 3vh, 28px); }
.marcas { display: flex; align-items: center; gap: 8px; min-width: 0; }
.marcas > svg { width: 38px; height: 38px; flex-shrink: 0; }
.marcas > b { font-family: var(--f-titulo); font-weight: 800; font-size: 26px; }
.logo-cliente { display: flex; align-items: center; margin-left: 4px; padding-left: 12px; border-left: 2px solid var(--borde); min-height: 34px;
  font-family: var(--f-titulo); font-weight: 700; font-size: 13px; line-height: 1.15; color: var(--oliva); max-width: 110px; }
.logo-cliente img { max-height: 44px; max-width: 100px; object-fit: contain; }
.chip.dia { gap: 7px; padding: 7px 12px; font-size: 13px; background: var(--suave); margin-left: auto; }
.chip.dia .ico { width: 20px; height: 20px; }
.saludo { padding-left: 16px; border-left: 4px solid var(--meta); display: flex; flex-direction: column; gap: 2px; }
.saludo h1 { font-size: clamp(28px, 8vw, 34px); }
.saludo .cargo { font-family: var(--f-titulo); font-weight: 800; font-size: 17px; color: var(--oliva); }
.saludo .zona { display: inline-flex; align-items: center; gap: 6px; font-size: 16px; color: var(--oliva); }

.comp .ico { width: 30px; height: 30px; color: var(--bosque-ola); }
.comp b { font-family: var(--f-titulo); font-size: clamp(11.5px, 3.3vw, 14px); line-height: 1.15; }
.comp small { font-size: clamp(10px, 2.7vw, 11.5px); line-height: 1.25; color: var(--oliva); }
.comp.activo { background: var(--suave); border-color: var(--meta); }
.comp.pronto { opacity: .55; cursor: not-allowed; }
.comp-cargado { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 16px; border: 1px solid var(--borde); background: var(--superficie); }
.comp-cargado.sin { background: var(--alerta-suave); border-color: transparent; }
.comp-cargado .crece { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.comp-cargado b { font-family: var(--f-titulo); font-size: 15.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.comp-cargado .crece span { font-size: 13px; color: var(--oliva); }
.miniatura { position: relative; flex-shrink: 0; }
.miniatura img { width: 84px; height: 58px; object-fit: cover; border-radius: 10px; display: block; }
.ok-badge { position: absolute; top: -6px; right: -6px; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bosque-ola); color: #fff; border: 2px solid var(--superficie); }
.ok-badge .ico { width: 16px; height: 16px; stroke-width: 3; }
.btn.ver { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--suave); border-color: color-mix(in srgb, var(--meta) 40%, transparent); gap: 6px; }
.btn.ver .ico { width: 20px; height: 20px; }
.btn.ver .tachon { display: none; }
.aviso-cli.revisar { background: #FFF6DB; }
.campos-cobro { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 16px; }
.fila-campo { display: grid; grid-template-columns: minmax(74px, 27%) 1fr; align-items: center; gap: 8px; }
.fc-lab { font-size: 14.5px; color: var(--bosque); }
.fc-ctrl { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 10px; border-radius: 12px; border: 1.5px solid var(--borde); background: var(--superficie); min-width: 0; }
.fc-ctrl > .ico { width: 22px; height: 22px; flex-shrink: 0; color: var(--bosque-ola); }
.fc-ctrl input, .fc-ctrl select { flex: 1; min-width: 0; border: 0; outline: 0; background: none; min-height: 44px; font-size: 15px; color: var(--bosque); padding: 0; }
.fc-ctrl:focus-within { border-color: var(--meta); }
label.campo .fc-ctrl { font-weight: 400; }
.visor { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: rgba(13, 29, 23, .92); }
.visor img { flex: 1; min-height: 0; object-fit: contain; border-radius: 12px; }
.visor .btn { align-self: flex-end; }
#app:has(.tipos-cobro) .pie .btn.primario { gap: 8px; font-size: clamp(15px, 4.3vw, 18px); white-space: nowrap; padding: 0 10px; }
/* ===== 0.7 · Ficha Visita no realizada ===== */
.sub-cli { font-family: var(--f-titulo); font-weight: 700; font-size: 17px; color: var(--oliva); }
.titulo-sec small { font-family: var(--f-texto); font-weight: 600; font-size: 15px; color: var(--oliva); }
.motivos { border-radius: 18px; }
.motivo { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; cursor: pointer; font-size: 16px; }
.motivo input { position: absolute; opacity: 0; pointer-events: none; }
.motivo .bolita { width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--oliva); }
.motivo:has(input:checked) { background: var(--suave); font-family: var(--f-titulo); font-weight: 700; }
.motivo:has(input:checked) .bolita { border: 7px solid var(--bosque-ola); box-shadow: 0 0 0 2px var(--superficie) inset; }
.motivo:has(input:focus-visible) { outline: 3px solid var(--meta); outline-offset: -3px; }
.fecha-repro { min-height: 54px; }
.info-ruta { display: flex; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--suave); }
.info-ruta .i-ico { display: grid; place-items: center; width: 26px; height: 26px; flex-shrink: 0; border-radius: 50%; border: 2px solid var(--bosque-ola); color: var(--bosque-ola); font-family: Georgia, serif; font-weight: 700; font-size: 15px; }
.info-ruta > span:last-child { display: flex; flex-direction: column; gap: 2px; }
.info-ruta b { font-family: var(--f-titulo); font-size: 16.5px; }
.info-ruta > span:last-child > span { font-size: 13.5px; line-height: 1.4; color: var(--oliva); }
#f-saltar .pie .btn.primario { gap: 10px; font-size: 19px; border-radius: 16px; }
.otro-motivo { display: none; padding: 4px 16px 14px 54px; background: var(--suave); }
.motivos:has(input[value="Otro motivo"]:checked) .otro-motivo { display: flex; }
.motivos:has(input[value="Otro motivo"]:checked) .motivo:last-of-type { border-bottom: 0; }
.otro-motivo textarea { font-size: 16px; min-height: 64px; }
#f-saltar .pie { position: static; background: transparent; padding-bottom: clamp(70px, 10vh, 100px); }
/* ===== 0.7 · Ficha Jornada en pausa ===== */
.pausa { gap: 20px; }
.pausa .ilus-pausa { width: min(62%, 240px); align-self: center; }
.pausa h1 { font-size: clamp(28px, 8vw, 34px); }
.pausa .nota-importante .sello { background: color-mix(in srgb, var(--meta) 35%, transparent); color: var(--bosque); }
.pausa .nota-importante .sello .ico { width: 26px; height: 26px; }
.pausa .btn { gap: 12px; min-height: 58px; border-radius: 16px; font-family: var(--f-titulo); font-size: 18px; }
.pausa .btn .ico { width: 28px; height: 28px; }
.pausa .btn:not(.primario) .ico { color: var(--bosque-ola); }
/* ===== 0.7 · Ficha Cotización ===== */
.cond-cot { border-radius: 16px; border-color: color-mix(in srgb, var(--meta) 45%, var(--borde)); }
.cond-cot .c-tit, .cotizaciones .c-tit { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-titulo); font-size: 16.5px; }
.cond-cot .c-tit .ico, .cotizaciones .c-tit .ico { color: var(--bosque-ola); }
.cotizaciones { border-radius: 18px; }
.cot-item { display: flex; flex-direction: column; gap: 8px; padding: 10px 0; border-top: 1px solid var(--borde); }
.cot-item.vencida b:first-child { color: var(--critico); }
.cot-item .entre > b.num { white-space: nowrap; }
.cot-acciones { display: grid; grid-template-columns: 1fr 1.1fr 1fr; gap: 6px; }
.cot-acciones .btn { min-height: 42px; padding: 0 6px; font-size: 13.5px; gap: 4px; border-radius: 12px; }
.cot-acciones .btn .ico { width: 18px; height: 18px; }
.cot-acciones .btn.primario { font-size: 13.5px; min-height: 42px; font-family: var(--f-texto); }
.btn.rechazar { color: var(--critico); }
.rechazo { padding: 8px; border-radius: 12px; background: var(--critico-suave); }
.cot-ok { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; margin-top: clamp(20px, 6vh, 50px); }
.ok-grande { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--suave); color: var(--bosque-ola); }
.ok-grande .ico { width: 52px; height: 52px; stroke-width: 2.4; }
.btn.whats { gap: 10px; border-radius: 16px; }
.btn.whats .ico { width: 26px; height: 26px; }
.logo-actual { display: block; max-width: 120px; max-height: 60px; margin: 6px 0; object-fit: contain; }
/* ===== 0.7 · Ficha Cierre de visita ===== */
.resultados { gap: 10px; }
.resultado { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 96px; padding: 12px 8px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--superficie); color: var(--bosque); cursor: pointer; font: inherit; }
.resultado .ico { width: 36px; height: 36px; color: var(--bosque-ola); }
.resultado b { font-family: var(--f-titulo); font-size: clamp(15px, 4.3vw, 17px); }
.resultado .ok-badge { display: none; top: 8px; right: 8px; width: 28px; height: 28px; background: var(--bosque-ola); }
.resultado[aria-pressed="true"] { background: var(--suave); border-color: var(--bosque-ola); border-width: 2px; }
.resultado[aria-pressed="true"] .ok-badge { display: grid; }
.resultado .ok-badge .ico { width: 18px; height: 18px; color: #fff; stroke-width: 3.2; }
.ok-badge .ico circle { display: none; }
.info-ruta.sigue { align-items: center; }
.i-cal { padding-right: 12px; border-right: 1.5px solid color-mix(in srgb, var(--meta) 50%, transparent); color: var(--bosque-ola); }
.i-cal .ico { width: 34px; height: 34px; }
#f-cerrar label.campo { font-size: 15px; color: var(--bosque); }
#f-cerrar .fc-ctrl { min-height: 54px; }
#f-cerrar .fc-ctrl select, #f-cerrar .fc-ctrl input { font-size: 16.5px; font-family: var(--f-titulo); font-weight: 700; }
.otra-accion { display: none !important; }
#f-cerrar:has(option[value="__otra"]:checked) .otra-accion { display: flex !important; }
#f-cerrar .pie { position: static; background: transparent; padding-bottom: clamp(70px, 10vh, 100px); }
#f-cerrar .pie .btn.primario { gap: 10px; font-size: 20px; border-radius: 16px; }
/* ===== 0.7 · Fichas Cierre con resumen (Solo vendí / Solo cobré / Vendí y cobré) ===== */
.resultado-visita { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 12px; padding: 14px; border-radius: 18px; background: var(--suave); }
.rv-ico { display: flex; align-items: flex-end; gap: 2px; color: var(--bosque); padding-right: 12px; border-right: 1.5px solid color-mix(in srgb, var(--meta) 45%, transparent); }
.rv-ico .ico { width: 34px; height: 34px; }
.rv-ico .ico + .ico { width: 26px; height: 26px; margin-left: -6px; }
.rv-tit { display: flex; flex-direction: column; }
.rv-tit small { font-family: var(--f-titulo); font-weight: 700; font-size: 13px; }
.rv-tit b { font-family: var(--f-titulo); font-size: clamp(19px, 5.4vw, 23px); white-space: nowrap; }
.rv-exp { grid-column: 1 / -1; padding-top: 8px; border-top: 1px solid color-mix(in srgb, var(--meta) 35%, transparent); font-size: 13.5px; line-height: 1.35; color: var(--oliva); }
.resumen-cierre { display: flex; flex-direction: column; gap: 10px; border-radius: 18px; padding: 12px; }
.rc-cab { align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--borde); }
.rc-cab .c-tit { display: inline-flex; align-items: center; gap: 8px; }
.rc-cab .c-tit b { font-family: var(--f-titulo); font-size: 16px; color: var(--bosque-ola); }
.rc-cab .c-tit .ico { color: var(--bosque-ola); width: 26px; height: 26px; }
.rc-cab .chip { font-size: 12px; }
.filas-dato > div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 2px; font-size: 14.5px; }
.filas-dato > div + div { border-top: 1px solid var(--borde); }
.tabla-cierre { border-radius: 12px; overflow: hidden; border: 1px solid var(--borde); }
.tabla-cierre table { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
.tabla-cierre th { background: var(--suave); font-family: var(--f-titulo); font-weight: 700; padding: 7px 4px; text-align: left; font-size: 11px; }
.tabla-cierre td { padding: 7px 4px; border-top: 1px solid var(--borde); vertical-align: top; }
.tabla-cierre td b { display: block; font-family: var(--f-titulo); font-size: 12.5px; }
.tabla-cierre td small { color: var(--oliva); font-size: 11px; }
.tabla-cierre .n { text-align: right; white-space: nowrap; } .tabla-cierre .c { text-align: center; }
.filas-tot > div { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 14.5px; font-variant-numeric: tabular-nums; }
.filas-tot > div + div { border-top: 1px solid var(--borde); }
.filas-tot .gran { margin-top: 4px; border-radius: 12px; background: var(--suave); border: 0 !important; padding: 10px 12px; font-family: var(--f-titulo); font-weight: 800; font-size: 17px; }
.filas-tot .gran span:last-child { font-size: 20px; }
.datos-cobro { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border: 1px solid var(--borde); border-radius: 12px; }
.datos-cobro > div { display: flex; align-items: center; gap: 6px; padding: 8px; min-width: 0; }
.datos-cobro > div + div { border-left: 1px solid var(--borde); }
.datos-cobro span span { overflow-wrap: anywhere; }
.datos-cobro .ico { width: 22px; height: 22px; color: var(--bosque-ola); flex-shrink: 0; }
.datos-cobro span { display: flex; flex-direction: column; min-width: 0; font-size: 12.5px; }
.datos-cobro b { font-size: 11.5px; font-family: var(--f-titulo); }
.totales-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-radius: 12px; background: var(--suave); }
.totales-3 > div { display: flex; gap: 6px; padding: 10px 8px; min-width: 0; }
.totales-3 > div + div { border-left: 1.5px solid color-mix(in srgb, var(--meta) 40%, transparent); }
.totales-3 .ico { display: none; }
.totales-3 span { display: flex; flex-direction: column; min-width: 0; }
.totales-3 small { font-family: var(--f-titulo); font-weight: 700; font-size: 11px; line-height: 1.2; }
.totales-3 b { font-family: var(--f-titulo); font-size: clamp(12.5px, 3.6vw, 16px); white-space: nowrap; }
.registrado { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--suave); font-size: 15px; }
.registrado .ico { width: 32px; height: 32px; flex-shrink: 0; color: #fff; background: var(--bosque-ola); border-radius: 50%; padding: 5px; stroke-width: 3; }
.registrado .ico circle { display: none; }
.sigue-plegable { border-radius: 16px; padding: 6px 12px; }
.sigue-plegable summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; }
.sigue-plegable summary::-webkit-details-marker { display: none; }
.sigue-plegable summary > .ico:first-child { color: var(--bosque-ola); width: 28px; height: 28px; }
.sigue-plegable summary .crece { display: flex; flex-direction: column; }
.sigue-plegable summary small { color: var(--oliva); font-size: 13px; }
.sigue-plegable summary > .ico:last-child { transform: rotate(90deg); }
.sigue-plegable[open] summary > .ico:last-child { transform: rotate(-90deg); }
.peq-enlace { font-size: 14.5px; padding-bottom: 80px; }
/* ===== 0.7 · Cierre con argumento y Cierre de jornada ===== */
.resultado-visita.sin .rv-ico { color: var(--critico); }
.resultado-visita.sin .rv-ico .ico { width: 38px; height: 38px; }
label.req, .req-lab { font-family: var(--f-titulo); font-weight: 700; font-size: 15px; color: var(--bosque); }
label.req::after, .req-lab::after { content: " *"; color: var(--critico); }
label.campo.req::after { content: none; }
label.campo.req { flex-direction: column; }
.arg-cab { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.sub-cli .ico { width: 18px; height: 18px; vertical-align: -3px; margin-right: 4px; }
.btn.dictar-arg { flex-shrink: 0; min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--suave); border-color: transparent; font-size: 14px; gap: 6px; }
.btn.dictar-arg .ico { width: 20px; height: 20px; color: var(--bosque-ola); }
.btn.dictar-arg.escuchando { background: var(--meta); color: #fff; } .btn.dictar-arg.escuchando .ico { color: #fff; }
#ar-texto { width: 100%; min-height: 104px; padding: 12px; border-radius: 12px; border: 1.5px solid var(--borde); font-size: 16px; resize: vertical; background: var(--superficie); color: var(--bosque); }
#ar-texto:focus { outline: 0; border-color: var(--meta); }
#ar-cuenta.corto { color: var(--alerta); }
#f-argumento .pie { position: static; background: transparent; }
#f-argumento .pie .btn.primario, .pie-fin .btn.primario { gap: 10px; font-size: 19px; border-radius: 16px; }
.registrado.grande { padding: 14px 16px; }
.registrado.grande .ico { width: 44px; height: 44px; padding: 8px; }
.registrado.grande > span { display: flex; flex-direction: column; }
.registrado.grande b { font-family: var(--f-titulo); font-size: 20px; }
.registrado.grande > span > span { font-size: 14px; color: var(--oliva); }
.cuadros4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.act-cuadro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 10px 4px; border-radius: 14px; border: 1px solid var(--borde); background: var(--superficie); }
.act-cuadro .ico { width: 26px; height: 26px; color: var(--bosque-ola); }
.act-cuadro b { font-family: var(--f-titulo); font-size: 24px; line-height: 1.1; }
.act-cuadro > span { font-size: 11.5px; line-height: 1.2; }
.act-cuadro.mal .ico { color: var(--critico); }
.act-cuadro.ancho { flex-direction: row; text-align: left; gap: 10px; padding: 10px 12px; background: var(--suave); border-color: transparent; }
.act-cuadro.ancho > span { display: flex; flex-direction: column; font-size: 13px; }
.act-cuadro.ancho .ico { width: 30px; height: 30px; }
.filas-ico > div { display: grid; grid-template-columns: 26px 1fr auto; align-items: center; gap: 10px; padding: 8px 2px; font-size: 15px; }
.filas-ico > div + div { border-top: 1px solid var(--borde); }
.filas-ico .ico { color: var(--bosque-ola); }
.filas-ico b { font-family: var(--f-titulo); font-size: 18px; }
.registrado.falta { background: var(--alerta-suave); }
.registrado.falta .ico { background: var(--alerta); }
.pendientes-fin { border-color: color-mix(in srgb, var(--alerta) 40%, var(--borde)); }
.pie-fin .btn.primario[disabled] { opacity: 1; background: color-mix(in srgb, var(--bosque) 45%, var(--crema)); border-color: transparent; }
.pie-fin { position: static; background: transparent; padding-bottom: clamp(70px, 10vh, 100px); }
/* ===== 0.7 · Cierre de jornada (final) y ¡Buen trabajo hoy! ===== */
.fecha-cab { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-titulo); font-weight: 700; font-size: 15px; white-space: nowrap; }
.fecha-cab .ico { color: var(--bosque-ola); width: 24px; height: 24px; }
.registrado.meta-ok { justify-content: center; }
.registrado.meta-ok .bandera { width: 58px; height: 58px; flex-shrink: 0; }
.cuadros4.suaves .act-cuadro { background: var(--suave); border-color: transparent; }
.act-cuadro > span small { display: block; color: var(--oliva); font-size: 10.5px; margin-top: 2px; }
.filas-tot .gran span:first-child { display: inline-flex; align-items: center; gap: 8px; }
.filas-tot .gran .ico { width: 22px; height: 22px; color: var(--bosque-ola); }
.despedida { position: relative; gap: 14px; align-items: stretch; padding-top: 0; padding-bottom: clamp(70px, 11vh, 110px); justify-content: flex-start; }
.paisaje { position: absolute; left: calc(50% - 50vw); width: 100vw; top: -16px; height: 300px; z-index: -1; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.despedida .ola-arriba { display: none; }
.paisaje svg { width: 100%; height: 100%; display: block; }
.despedida > .logo { justify-content: center; margin-top: 18px; }
.ok-sol { position: relative; display: grid; place-items: center; margin-top: 150px; }
.ok-sol .rayos svg { width: 210px; height: 105px; display: block; }
.ok-sol .ok-grande { position: absolute; width: 92px; height: 92px; background: var(--bosque-ola); color: #fff; }
.ok-sol .ok-grande .ico { width: 56px; height: 56px; stroke-width: 3; }
.ok-sol .ok-grande .ico circle { display: none; }
.despedida h1 { font-size: clamp(34px, 10vw, 44px); }
.despedida .sub { font-size: 19px; }
.frase-calida { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 14px 16px; border-radius: 999px; background: var(--suave); }
.frase-calida .ico { width: 40px; height: 40px; color: var(--bosque-ola); flex-shrink: 0; stroke-width: 1.6; }
.frase-calida b { font-family: var(--f-titulo); font-size: clamp(18px, 5.4vw, 26px); white-space: nowrap; }
.frase-calida.hoja { border-radius: 28px; }
.frase-calida i { font-family: var(--f-titulo); font-weight: 800; font-size: clamp(16px, 4.6vw, 20px); color: var(--bosque-ola); line-height: 1.3; }
.texto-calido { font-size: 16.5px; line-height: 1.5; padding: 0 6px; }
.cumbre { display: flex; flex-direction: column; align-items: center; gap: 2px; margin-top: 6px; }
.ilus-cumbre { width: 200px; }
.cumbre .logo { font-size: 30px; }
.cumbre .lema { font-size: 16px; color: var(--bosque); }
.despedida .btn.primario { gap: 12px; font-size: 20px; border-radius: 16px; }
.despedida .btn.primario .ico { width: 28px; height: 28px; }
/* ===== 0.7 · Estilo común para el resto de pantallas del asesor ===== */
.tarjeta { border-radius: 18px; }
.lista { border-radius: 18px; }

var qa='<svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M47 15 A22 22 0 1 0 54 32" fill="none" stroke="var(--meta)" stroke-width="7" stroke-linecap="round"></path><path d="M22 31 l8 8 l18 -20" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path></svg>';function P(a,e="menu",o=""){return`<div class="barra"><button class="volver" data-ir="${e}">${H("atras")}${v(a)}</button>${o}</div>`}function Ra(a,e=""){let o=Math.max(0,Math.min(100,a||0));return`<div class="medidor ${e}" role="img" aria-label="${Math.round(a||0)} por ciento"><span style="width:${o}%"></span></div>`}function _(a){return a==null||a===""||isNaN(a)?"":"$ "+Math.round(a).toLocaleString("es-CO")}function Ke(a){let e=a.value.replace(/\D/g,"").replace(/^0+(?=\d)/,"");a.value=e?"$ "+Number(e).toLocaleString("es-CO"):""}function ge(a){return a?.talla?`<span class="chip">${a.base==="potencial"?"Puede ser talla ":"Talla "}${a.talla}${a.base==="gerente"?" \xB7 asignada":""}</span>`:""}var W={leer(a){try{return localStorage.getItem("cierro:"+a)}catch{return null}},escribir(a,e){try{localStorage.setItem("cierro:"+a,e)}catch{}}};function G(a){let e={};for(let[o,t]of new FormData(a).entries())e[o]=typeof t=="string"?t.trim():t;return e}var $e=[{"tipo": "ventas", "titulo": "Visión 360 en ventas", "texto": "Antes de ofrecer, conoce el negocio completo: sus equipos, operación, forma de pago y relaciones comerciales.", "frase": "Ofrece soluciones, no solamente productos."}, {"tipo": "ventas", "titulo": "Toda visita deja un avance", "texto": "Si hoy no hay pedido, sal con algo concreto: una cotización, una fecha de compra o una cita con quien decide.", "frase": "Sin próximo paso, no hubo visita."}, {"tipo": "ventas", "titulo": "En B2B, conoce a los tres", "texto": "En una empresa casi siempre deciden tres personas: el jefe de taller, compras y pagos. Si solo conoces a una, tu venta depende de esa sola puerta.", "frase": "Más contactos, cuent
